name: Capturer les vrais Réglages iOS
on:
  workflow_dispatch:
    inputs:
      ios_major:
        description: Version majeure déjà installée sur le runner (26, 18 ou auto)
        default: '26'
        required: true
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Démarrer le simulateur et capturer Réglages
        env:
          IOS_MAJOR: ${{ inputs.ios_major }}
        run: python3 scripts/ios-reference/capture.py
      - name: Conserver les captures et diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-settings-reference
          path: artifacts/ios-reference
          retention-days: 7
          if-no-files-found: warn
